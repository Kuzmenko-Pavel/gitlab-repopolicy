name: e2e

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gitlab: [19.4.2-ce.0, 19.3.5-ce.0, 19.2.8-ce.0]
    name: e2e (GitLab ${{ matrix.gitlab }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/*/go.sum
      - run: make test-e2e
        env:
          GITLAB_VERSION: ${{ matrix.gitlab }}
      - if: failure()
        run: make test-e2e-logs
        env:
          GITLAB_VERSION: ${{ matrix.gitlab }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.gitlab }}
          path: bin/e2e-logs/
          retention-days: 14
