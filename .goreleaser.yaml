version: 2

project_name: gitlab-repopolicy

builds:
  - id: gitlab-repopolicy
    main: ./cmd/gitlab-repopolicy
    binary: gitlab-repopolicy
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/buildinfo.Version={{ .Version }}
      - -X {{ .ModulePath }}/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X {{ .ModulePath }}/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gitlab-repopolicy
    ids: [gitlab-repopolicy]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.en.md
        info:
          mtime: "{{ .CommitDate }}"

nfpms:
  - id: packages
    ids: [gitlab-repopolicy]
    package_name: gitlab-repopolicy
    # Version in file names without a tilde; nfpm writes 1.0.0~rc.1 into the metadata.
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Pavel Kuzmenko
    maintainer: Pavel Kuzmenko <8388200+Kuzmenko-Pavel@users.noreply.github.com>
    homepage: https://github.com/Kuzmenko-Pavel/gitlab-repopolicy
    description: Repository-local path, commit and tag policies for GitLab, enforced by a Gitaly pre-receive hook.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - dst: /etc/gitlab-repopolicy
        type: dir
        file_info: { mode: 0755, mtime: "{{ .CommitDate }}" }
      - src: config/config.yaml
        dst: /etc/gitlab-repopolicy/config.yaml
        type: config|noreplace
        file_info: { mode: 0640, mtime: "{{ .CommitDate }}" }
      - dst: /etc/gitlab-repopolicy/breakglass
        type: dir
        file_info: { mode: 0755, mtime: "{{ .CommitDate }}" }
      - src: packaging/systemd/gitlab-repopolicy-token-rotate.service
        dst: /usr/lib/systemd/system/gitlab-repopolicy-token-rotate.service
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: packaging/systemd/gitlab-repopolicy-token-rotate.timer
        dst: /usr/lib/systemd/system/gitlab-repopolicy-token-rotate.timer
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: packaging/systemd/gitlab-repopolicy-settings-check.service
        dst: /usr/lib/systemd/system/gitlab-repopolicy-settings-check.service
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: packaging/systemd/gitlab-repopolicy-settings-check.timer
        dst: /usr/lib/systemd/system/gitlab-repopolicy-settings-check.timer
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
    # /var/log/gitlab-repopolicy is created by postinstall: see the script.
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

sboms:
  - id: archives
    artifacts: archive
    documents: ["{{ .ArtifactName }}.spdx.json"]

checksum:
  name_template: checksums.txt

# Keyless: the OIDC token of the release workflow; the bundle holds the certificate and the signature.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]
    output: true

# The release text is the message of the signed tag (make release-publish passes it).
changelog:
  disable: true

release:
  github:
    owner: Kuzmenko-Pavel
    name: gitlab-repopolicy
  name_template: "{{ .Version }}"
  prerelease: auto

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"
