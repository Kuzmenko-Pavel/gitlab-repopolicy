extends: default

# Policy files are checked by gitlab-repopolicy validate, not by yamllint (design §3.3).
ignore: |
  bin/
  dist/
  coverage/
  tests/corpus/

rules:
  document-start: disable
  line-length:
    max: 160
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
