# Codecov: a comment with the coverage diff on every pull request and a
# status check that fails when the project coverage drops by more than 1%.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        informational: true
# Test code is not product code: the integration tests and the policy
# module that only the tests import.
ignore:
  - "tests/**"
  - "internal/testmodule/**"
comment:
  layout: "diff, flags, files"
  # Without it the comment shows only the coverage of the changed lines.
  hide_project_coverage: false
