mode: audit
gitlab_url: https://gitlab.example.com/
ca_file: /etc/ssl/gitlab-ca.pem
token_file: /etc/gitlab-repopolicy/token
token_lifetime: 30d
audit:
  file: /var/log/gitlab-repopolicy/audit.log
  stdout: true
breakglass_dir: /etc/gitlab-repopolicy/breakglass
timeouts: { total: 8s, http: 2s }
max_api_calls: 20
modules:
  pathpolicy: enabled
  commitpolicy: disabled
default_branch: [trunk]
settings_check:
  protected_tags: ["v*"]
  job_token_push: false
presets:
  commitpolicy:
    org-conventional:
      rules:
        conventional:
          match: all
          checks:
            type-enum:
              allowed: { level: error, value: [feat, fix] }
          message: Commits follow Conventional Commits.
