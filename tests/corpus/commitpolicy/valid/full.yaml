version: 1
mode: warn
rules:
  commits:
    match: [main, '/^feature\//', '!feature/legacy']
    parser: conventional
    except:
      merge_commit: true
      git_reverts: true
      merged_commits: true
      users: [release-bot]
    checks:
      type-enum:            { level: error, value: [feat, fix, build, chore, ci, docs, perf, refactor, revert, style, test] }
      scope:                { level: error, value: optional }
      scope-enum:           { level: warn,  value: [api, ui] }
      breaking-bang:        { level: error, value: allow }
      header-max-length:    { level: warn,  value: 100 }
      subject-case:         { level: error, value: lower-first }
      subject-full-stop:    { level: error, value: forbid }
      body-required:        { level: error, types: [feat, fix] }
      body-max-line-length: { level: warn,  value: 120 }
      trailer-required:     { level: error, value: [Signed-off-by] }
      pattern:              { level: error, location: trailer, keys: [Issue, Refs], value: '/[A-Za-z0-9_.\/-]*#[0-9]+/', types: [feat, fix] }
    message: >-
      Commits follow Conventional Commits.
    help:
      contact: "#dev"
      docs_url: https://wiki.example/commits
  release:
    match: ['/^release\//']
    parser: conventional
    checks:
      type-enum: { level: error, value: [fix, docs, chore] }
    message: Release branches take only fix, docs and chore.
  no-wip:
    match: all
    parser: free
    checks:
      pattern: { level: warn, location: header, value: '!/^(WIP|fixup!)/i' }
    message: Squash WIP and fixup commits before the merge.
  default-only:
    match: default
    parser: free
    checks:
      subject-full-stop: { level: warn, value: forbid }
    message: m
