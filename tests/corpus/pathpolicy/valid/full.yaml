version: 1
admins: [platform-lead, sre-lead]
rules:
  ci-config:
    match: all
    paths: [".gitlab-ci.yml", ".gitlab/ci/**", "Makefile", "scripts/deploy/**"]
    allow: [platform-lead, sre-lead, ci-maintainer]
    message: >-
      CI/CD configuration is changed by the platform team. Propose a change through a merge request.
    help:
      contact: "#platform"
  commit-policy:
    match: all
    paths: ["COMMITPOLICY"]
    allow: [dev-lead]
    message: COMMITPOLICY belongs to dev-lead.
  prod-values:
    match: [main, '/^release\//']
    check_history: incoming
    paths: ["helm/**/values-prod.yaml"]
    allow: [platform-lead, release-manager]
    message: Prod values are changed by release managers.
  release:
    match: ['!/^feature\//']
    check_history: new-content
    paths: ["deploy/**"]
    allow: [release-manager]
    message: Deploy files are changed by the release manager outside feature branches.
  default-only:
    match: default
    paths: ["docs/policy/**"]
    allow: [platform-lead]
    message: Policy docs are changed by the platform lead.
