---
# Server config of the e2e stand; the bootstrap writes it to
# /etc/gitlab-repopolicy/config.yaml.
mode: enforce
gitlab_url: http+unix://%2Fvar%2Fopt%2Fgitlab%2Fgitlab-workhorse%2Fsockets%2Fsocket
token_file: /etc/gitlab-repopolicy/token
audit:
  file: /var/log/gitlab-repopolicy/audit.log
  stdout: false
default_branch: [main]
# The stand may run on a single CPU, where GitLab answers in seconds. The
# hook total stays below the deadline Rails gives the Gitaly call, about 55s.
timeouts:
  total: 45s
  http: 15s
