# Every branch, without the commits that a merge brings in.
version: 1
rules:
  all:
    match: ['/.*/']
    check_history: incoming
    message: m
    except: {merge_commit: true, merged_commits: true}
    checks:
      header-format: {conventional: {level: error, value: required}}
      type-enum: {allowed: {level: error, value: [feat, fix]}}
